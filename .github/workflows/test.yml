name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  debian:
    name: Debian 13
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Motori e librerie di sistema
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates python3 python3-venv file \
            ffmpeg imagemagick poppler-utils ghostscript pandoc \
            libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
      - uses: actions/checkout@v5
      - name: Installazione
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install -q -e '.[dev]'
      - name: Test
        run: /opt/venv/bin/pytest -q -rs

  windows:
    name: Windows
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Motori
        shell: pwsh
        run: |
          choco install -y --no-progress ffmpeg imagemagick pandoc ghostscript
          # Poppler non ha un pacchetto choco ufficiale: build per Windows da GitHub.
          gh release download -R oschwartz10612/poppler-windows --pattern "Release-*.zip" -D "$env:RUNNER_TEMP"
          Expand-Archive (Get-ChildItem "$env:RUNNER_TEMP\Release-*.zip").FullName "$env:RUNNER_TEMP\poppler"
          $dirs = @(
            (Get-ChildItem "C:\Program Files" -Directory -Filter "ImageMagick*" | Select-Object -First 1).FullName,
            "C:\Program Files\Pandoc",
            (Get-ChildItem "$env:RUNNER_TEMP\poppler" -Recurse -Filter pdftoppm.exe | Select-Object -First 1).DirectoryName
          )
          # Ghostscript resta fuori dal PATH di proposito: ANYFILE deve trovarlo da solo
          # nella cartella di installazione, come dopo un'installazione normale.
          $dirs | Where-Object { $_ } | ForEach-Object { Add-Content $env:GITHUB_PATH $_ }
      - name: Installazione
        run: python -m pip install -q -e ".[dev]"
      - name: Motori trovati
        run: anyfile engines
      - name: Test
        run: python -m pytest -q -rs
