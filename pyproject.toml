[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anyfile"
version = "0.3.0"
description = "Local file converter for Linux with a radial menu for KDE Dolphin"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
anyfile = "anyfile.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Translations are read at runtime from the .po files.
anyfile = ["locale/*.po"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: conversioni reali lente (LibreOffice, video)"]
